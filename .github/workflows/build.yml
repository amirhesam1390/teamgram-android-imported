name: Build Telegram APK

on:
  push:
    branches: [ master, main, teamgram2, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      run: |
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

    - name: Install NDK
      run: |
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
        yes | sdkmanager --licenses || true
        sdkmanager "ndk;27.2.12479018"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

    - name: Fix gradle.properties (MaxPermSize -> MaxMetaspaceSize)
      run: |
        find . -name "gradle.properties" -not -path "*/build/*" -exec sed -i 's/-XX:MaxPermSize=[0-9]*m/-XX:MaxMetaspaceSize=4096m/g' {} \;
        echo "--- gradle.properties after fix ---"
        find . -name "gradle.properties" -not -path "*/build/*" -exec cat {} \;

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew :TMessagesProj_App:assembleDebug --stacktrace --info

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: telegram-debug-apk
        path: TMessagesProj_App/build/outputs/apk/**/*.apk
        if-no-files-found: warn
