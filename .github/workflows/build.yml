name: Build Telegram APK

on:
  push:
    branches: [ master, main, teamgram2, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # 1) JDK 17 برای sdkmanager
    - name: Set up JDK 17 (for sdkmanager)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 2) نصب SDK با اسکریپت مستقیم (بدون setup-android که مشکل JDK داره)
    - name: Install SDK 31 + NDK 21 + CMake
      run: |
        export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        SDKMGR=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
        if [ ! -x "$SDKMGR" ]; then
          SDKMGR=$(find $ANDROID_SDK_ROOT/cmdline-tools -name sdkmanager | head -1)
        fi
        echo "Using sdkmanager: $SDKMGR"
        yes | $SDKMGR --licenses || true
        $SDKMGR "platform-tools" \
                "platforms;android-31" \
                "build-tools;31.0.0" \
                "ndk;21.4.7075529" \
                "cmake;3.10.2.4988404"

    # 3) برگشت به JDK 11 برای Gradle
    - name: Set up JDK 11 (for Gradle)
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Export NDK env
      run: |
        echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/21.4.7075529" >> $GITHUB_ENV
        echo "ANDROID_NDK=/usr/local/lib/android/sdk/ndk/21.4.7075529" >> $GITHUB_ENV

    - name: Ensure google-services.json
      run: |
        if [ ! -f TMessagesProj_App/google-services.json ]; then
          echo '{"project_info":{"project_number":"000000000000","project_id":"fake","storage_bucket":"fake.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"org.telegram.messenger"}},"oauth_client":[],"api_key":[{"current_key":"fake"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > TMessagesProj_App/google-services.json
        fi

    - name: Set signing props
      run: |
        grep -q RELEASE_STORE_PASSWORD gradle.properties || echo "RELEASE_STORE_PASSWORD=android" >> gradle.properties
        grep -q RELEASE_KEY_ALIAS gradle.properties || echo "RELEASE_KEY_ALIAS=androiddebugkey" >> gradle.properties
        grep -q RELEASE_KEY_PASSWORD gradle.properties || echo "RELEASE_KEY_PASSWORD=android" >> gradle.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: telegram-debug-apk
        path: TMessagesProj_App/build/outputs/apk/**/*.apk
        if-no-files-found: warn
